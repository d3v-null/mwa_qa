name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # the trimmed observation the manual_testing.md flows run against. The full
  # one is mwa_qa_1226233968.zip in the same bucket, 13 GB, which will not fit
  # on a hosted runner.
  FIXTURE_URL: https://projects.pawsey.org.au/mwa-qa/mwa_qa_fixture_1226233968.zip

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # the fixture is ~100 MB and changes rarely, so it is worth keeping
      - name: Cache demo fixture
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/mwa_qa
          key: mwa-qa-fixture-${{ env.FIXTURE_URL }}

      - name: Fetch demo fixture
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mwa_qa
          curl -fsSL "$FIXTURE_URL" -o ~/.cache/mwa_qa/fixture.zip
          unzip -q -o ~/.cache/mwa_qa/fixture.zip -d ~/.cache/mwa_qa
          rm ~/.cache/mwa_qa/fixture.zip

      - name: Test
        env:
          MPLBACKEND: Agg
        run: |
          # the fixture unpacks as <cache>/1226233968/{prep,raw,cal,img}.
          # point this at a full observation instead to run the same tests
          # against real-sized data.
          export MWA_QA_DEMO_DATA="$HOME/.cache/mwa_qa"
          pytest mwa_qa/tests -v --cov=mwa_qa --cov-report=term-missing

  docker:
    # the image pins different dependency versions to the host job, so it is
    # tested as built rather than assumed to work
    name: docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache demo fixture
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/mwa_qa
          key: mwa-qa-fixture-${{ env.FIXTURE_URL }}

      - name: Fetch demo fixture
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/mwa_qa
          curl -fsSL "$FIXTURE_URL" -o ~/.cache/mwa_qa/fixture.zip
          unzip -q -o ~/.cache/mwa_qa/fixture.zip -d ~/.cache/mwa_qa
          rm ~/.cache/mwa_qa/fixture.zip

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mwa_qa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test inside the image
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$HOME/.cache/mwa_qa:/demo:ro" \
            -e MWA_QA_DEMO_DATA=/demo \
            -e MPLBACKEND=Agg \
            -w / mwa_qa:ci \
            -c "pytest --pyargs mwa_qa.tests -v"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: d3vnull0/mwa_qa
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # reuses the layers built above, so this is a push rather than a rebuild
      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
